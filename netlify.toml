# Static site (Next.js `output: 'export'`). No Netlify Next.js runtime
# needed — Netlify just serves the static files from `out/`.

[build]
  command = "next build"
  publish = "out"

[build.environment]
  NODE_VERSION = "20"
  NEXT_TELEMETRY_DISABLED = "1"

# Don't index the admin on search engines
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex"
